<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174b3a"><title>BioMaster S3｜健康的身體</title><link rel="stylesheet" href="style.css"></head><body>
<main class="shell"><nav><a href="../">← 選擇科目</a><button id="settings" class="ghost">⚙ 設定</button></nav><header><div class="brand"><span class="logo" aria-hidden="true">✿</span><div><small>BIOMASTER · S3</small><h1>健康的身體</h1></div></div><p>先想答案，再翻開閃卡核對。每日一點，慢慢掌握生物知識。</p></header>
<section class="summary" aria-label="學習進度"><div><span>已閱讀</span><strong id="seenCount">0</strong></div><div><span>待重溫收藏</span><strong id="savedCount">0</strong></div><div><span>全站題目</span><strong id="totalCount">0</strong></div></section><div class="progress"><span id="progress"></span></div>
<div class="toolbar"><label for="topic">選擇課題</label><select id="topic"></select><label for="mode">顯示</label><select id="mode"><option value="all">全部閃卡</option><option value="saved">只看待重溫</option><option value="unread">只看未讀</option></select></div><div id="topics" class="topics" aria-label="課題分類"></div>
<section class="study"><div class="studyhead"><div><small>生物閃卡 · 第 12 課</small><h2 id="topicTitle"></h2></div><b id="counter"></b></div><button id="card" class="card"><span id="side">問題</span><strong id="cardText"></strong><img id="diagram" alt="食物經過口腔、食道、胃、小腸、大腸，最後到肛門的示意圖" hidden style="width:100%;max-width:640px"><small id="hint">點按翻看答案</small></button><div class="actions"><button id="prev">← 上一張</button><button id="flip" class="primary">翻看答案</button><button id="next">下一張 →</button></div><div class="secondary"><button id="save">☆ 加入待重溫</button><button id="shuffle">⇄ 洗牌</button><button id="resetOrder">按原次序</button></div><p id="empty" hidden>這個篩選目前沒有閃卡。試試選擇其他課題或顯示方式。</p></section>
<footer>學習紀錄儲存在此裝置的瀏覽器中；更換裝置或清除資料前，請先匯出進度。<br>食物試驗應在老師指導下進行。 · BioMaster S3</footer></main>
<dialog id="dialog"><div class="dialog"><div class="studyhead"><h2>設定與備份</h2><button id="close" class="ghost" aria-label="關閉設定">✕</button></div><p>進度只儲存在這個瀏覽器。匯入會取代現有生物進度，不影響化學進度。</p><button id="export">匯出生物進度</button><label class="file">匯入生物進度<input id="import" type="file" accept="application/json,.json"></label><button id="clear" class="danger">清除生物進度</button><p id="message" role="status"></p></div></dialog>
<script src="cards.js"></script><script src="app.js"></script></body></html>
